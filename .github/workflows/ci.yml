name: CI

on:
  push:
    branches: [main, master, 'feat/**']
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build JS bundle
        run: npm run build:js

      - name: XSS audit
        run: npm run audit:xss

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: E2E tests
        env:
          CI: true
        run: npm run test:e2e

  # C-31: FINISH_MATRIX=1 required (see capricorn-tooling/shared/testing/FINISH-MATRIX-CI.md).
  finish-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build:js
      - run: npx playwright install --with-deps chromium
      - name: Finish matrix
        env:
          FINISH_MATRIX: "1"
        run: npm run test:matrix
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finish-matrix-shots
          path: qa/finish-loop/shots/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matrix-results
          path: qa/finish-loop/matrix-results.json
          retention-days: 14
