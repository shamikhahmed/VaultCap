name: Deploy Pages

# Deploy only after CI succeeds on main (C-02). Manual dispatch still allowed.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build JS bundle
        run: npm run build:js

      - name: Stage allowlisted site (C-57)
        env:
          SW_FILE: sw-v51.js
          ALLOW_PATHS: >-
            index.html landing.html pitch.html presentation.html privacy.html
            changelog.html screen-gallery.html install.html widget.html
            sw-v51.js manifest.json VERSION.json
            css js assets icons dist vendor
            apple-touch-icon.png favicon.svg mark.svg
            icon.svg icon-mark.svg
            icon-192.png icon-512.png icon-1024.png
            icon-maskable-192.png icon-maskable-512.png
          FORBIDDEN_EXTRA: resources scripts worker docs memory ios www
        run: bash scripts/stage-pages-site.sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
