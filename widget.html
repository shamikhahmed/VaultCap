<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VaultOS Widget</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    background: transparent;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
  }
  .widget {
    background: rgba(10, 10, 20, 0.85);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.12);
    padding: 18px 20px;
    width: 100%;
    max-width: 360px;
    color: #fff;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .widget-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .widget-icon {
    width: 28px;
    height: 28px;
    border-radius: 7px;
    background: #0A84FF;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .widget-title {
    font-size: 12px;
    font-weight: 600;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }
  .widget-nw {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1;
    margin-bottom: 4px;
  }
  .widget-sub {
    font-size: 12px;
    color: rgba(255,255,255,0.45);
    margin-bottom: 14px;
  }
  .widget-row {
    display: flex;
    gap: 12px;
  }
  .widget-stat {
    flex: 1;
    background: rgba(255,255,255,0.06);
    border-radius: 12px;
    padding: 10px 12px;
    text-align: center;
  }
  .widget-stat-n {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .widget-stat-l {
    font-size: 10px;
    color: rgba(255,255,255,0.4);
    margin-top: 2px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .widget-updated {
    font-size: 10px;
    color: rgba(255,255,255,0.25);
    margin-top: 12px;
    text-align: right;
  }
  .widget-empty {
    text-align: center;
    padding: 20px;
    color: rgba(255,255,255,0.4);
    font-size: 13px;
    line-height: 1.6;
  }
  .widget-empty-icon { font-size: 32px; margin-bottom: 10px; }
  .open-btn {
    display: block;
    margin-top: 12px;
    padding: 10px;
    background: #0A84FF;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    width: 100%;
  }
</style>
</head>
<body>
<div class="widget" id="widget"></div>
<script>
function fmt(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(0) + 'K';
  return n.toLocaleString();
}

function timeAgo(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  const mins = Math.round(diff / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return hrs + 'h ago';
  return Math.round(hrs / 24) + 'd ago';
}

function render() {
  const el = document.getElementById('widget');
  let snap;
  try { snap = JSON.parse(localStorage.getItem('vaultos_widget')); } catch(e) {}

  if (!snap) {
    el.innerHTML = `
      <div class="widget-header">
        <div class="widget-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <div class="widget-title">VaultOS</div>
      </div>
      <div class="widget-empty">
        <div class="widget-empty-icon">🔒</div>
        Open VaultOS to sync your widget
        <a class="open-btn" href="index.html">Open VaultOS</a>
      </div>`;
    return;
  }

  el.innerHTML = `
    <div class="widget-header">
      <div class="widget-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round">
          <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <div class="widget-title">Net Worth</div>
    </div>
    <div class="widget-nw">${snap.currency} ${fmt(snap.nw)}</div>
    <div class="widget-sub">${snap.name ? snap.name + ' · ' : ''}VaultOS</div>
    <div class="widget-row">
      <div class="widget-stat">
        <div class="widget-stat-n">${snap.banks}</div>
        <div class="widget-stat-l">Banks</div>
      </div>
      <div class="widget-stat">
        <div class="widget-stat-n">${snap.cards}</div>
        <div class="widget-stat-l">Cards</div>
      </div>
    </div>
    <div class="widget-updated">Updated ${timeAgo(snap.updated)}</div>`;
}

render();
setInterval(render, 60000);
</script>
</body>
</html>
