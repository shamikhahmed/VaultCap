<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080808">
<title>VaultCap Widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080808;
  --accent:#5b8dee;
  --accent2:#7aa8f5;
  --ok:#34c759;
  --warn:#ff9f0a;
  --err:#ff453a;
  --text:#ffffff;
  --text2:rgba(255,255,255,0.55);
  --text3:rgba(255,255,255,0.28);
  --glass:rgba(255,255,255,0.05);
  --glass2:rgba(255,255,255,0.08);
  --border:rgba(255,255,255,0.1);
  --border2:rgba(255,255,255,0.06);
  --glow:rgba(91,141,238,0.12);
}
html,body{
  min-height:100vh;
  background:var(--bg);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;
  color:var(--text);
  overflow-x:hidden;
}
body::before{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 80% 50% at 20% 10%, rgba(91,141,238,0.18) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 90%, rgba(52,199,89,0.08) 0%, transparent 50%),
    radial-gradient(ellipse 40% 60% at 60% 30%, rgba(122,168,245,0.06) 0%, transparent 50%);
  pointer-events:none;
  z-index:0;
  animation:gradShift 8s ease-in-out infinite alternate;
}
@keyframes gradShift{
  0%{opacity:1}
  100%{opacity:.6}
}
.wrap{
  position:relative;z-index:1;
  max-width:440px;
  margin:0 auto;
  padding:20px 16px 40px;
}

/* Header */
.hdr{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:24px;
}
.hdr-brand{
  display:flex;align-items:center;gap:10px;
}
.hdr-icon{
  width:32px;height:32px;border-radius:9px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(91,141,238,0.4);
  flex-shrink:0;
}
.hdr-title{font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--text2)}
.refresh-btn{
  width:32px;height:32px;border-radius:50%;border:1px solid var(--border);
  background:var(--glass);backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  color:var(--text2);font-size:15px;transition:all .2s;
}
.refresh-btn:active{transform:rotate(180deg) scale(.9);color:var(--accent)}

/* Net Worth Hero */
.hero{
  background:linear-gradient(135deg,rgba(91,141,238,0.15),rgba(91,141,238,0.04));
  border:1px solid rgba(91,141,238,0.25);
  border-radius:20px;
  padding:22px 20px;
  margin-bottom:14px;
  position:relative;
  overflow:hidden;
}
.hero::before{
  content:'';position:absolute;top:-30px;right:-30px;
  width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle,rgba(91,141,238,0.2),transparent 70%);
}
.hero-label{font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--text2);margin-bottom:6px}
.hero-nw{
  font-size:38px;font-weight:900;letter-spacing:-1.5px;line-height:1;
  background:linear-gradient(135deg,#fff,var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:6px;
}
.hero-name{font-size:12px;color:var(--text3);font-weight:500}

/* Stats Row */
.stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  margin-bottom:14px;
}
.stat{
  background:var(--glass);border:1px solid var(--border2);
  border-radius:16px;padding:14px 10px;text-align:center;
}
.stat-n{font-size:22px;font-weight:800;letter-spacing:-.5px;line-height:1}
.stat-l{font-size:10px;color:var(--text3);margin-top:4px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}

/* Health Bar */
.health{
  background:var(--glass);border:1px solid var(--border2);
  border-radius:16px;padding:14px 16px;margin-bottom:14px;
}
.health-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.health-label{font-size:12px;font-weight:700;color:var(--text2)}
.health-score{font-size:15px;font-weight:800}
.health-bar-bg{
  height:6px;border-radius:999px;
  background:rgba(255,255,255,0.08);
  overflow:hidden;
}
.health-bar-fill{
  height:100%;border-radius:999px;
  transition:width .8s cubic-bezier(.23,1,.32,1);
  background:linear-gradient(90deg,var(--ok),#30d158);
}
.health-bar-fill.warn{background:linear-gradient(90deg,var(--warn),#ffcc00)}
.health-bar-fill.err{background:linear-gradient(90deg,var(--err),#ff6b6b)}

/* Expiring Items */
.expiring{
  background:linear-gradient(135deg,rgba(255,159,10,0.1),rgba(255,159,10,0.03));
  border:1px solid rgba(255,159,10,0.2);
  border-radius:16px;padding:14px 16px;margin-bottom:14px;
}
.expiring-hdr{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--warn);margin-bottom:10px}
.exp-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05);
  font-size:12px;
}
.exp-item:last-child{border-bottom:none}
.exp-name{font-weight:600;color:var(--text)}
.exp-date{color:var(--warn);font-weight:600;font-size:11px}

/* Footer row */
.footer-row{
  display:flex;gap:10px;align-items:center;margin-top:4px;
}
.open-btn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 20px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;border:none;border-radius:16px;
  font-size:15px;font-weight:700;cursor:pointer;
  text-decoration:none;
  box-shadow:0 4px 20px rgba(91,141,238,0.35);
  transition:all .2s;letter-spacing:-.1px;
}
.open-btn:active{transform:scale(.97);box-shadow:0 2px 10px rgba(91,141,238,0.25)}

/* Stale badge */
.stale-badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 9px;border-radius:999px;
  background:rgba(255,159,10,0.15);border:1px solid rgba(255,159,10,0.3);
  font-size:10px;font-weight:600;color:var(--warn);
}

/* Updated line */
.updated-row{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:16px;
  font-size:10px;color:var(--text3);
}

/* Empty state */
.empty{
  background:var(--glass);border:1px solid var(--border);
  border-radius:20px;padding:36px 24px;text-align:center;
}
.empty-ic{font-size:44px;margin-bottom:14px}
.empty-title{font-size:17px;font-weight:700;margin-bottom:8px}
.empty-sub{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:20px}

/* Backup dot */
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot-ok{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.dot-warn{background:var(--warn);box-shadow:0 0 6px var(--warn)}
.dot-err{background:var(--err);box-shadow:0 0 6px var(--err)}

.install-tip{
  margin-top:16px;text-align:center;
  font-size:11px;color:var(--text3);line-height:1.6;
}
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<script>
function fmt(n, cur) {
  const abs = Math.abs(n);
  const sign = n < 0 ? '-' : '';
  let val;
  if (abs >= 1e9) val = (abs/1e9).toFixed(1)+'B';
  else if (abs >= 1e6) val = (abs/1e6).toFixed(1)+'M';
  else if (abs >= 1e3) val = (abs/1e3).toFixed(0)+'K';
  else val = abs.toLocaleString();
  return sign + (cur||'') + ' ' + val;
}

function timeAgo(iso) {
  if (!iso) return 'never';
  const diff = Date.now() - new Date(iso).getTime();
  const mins = Math.round(diff / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return hrs + 'h ago';
  const days = Math.round(hrs / 24);
  if (days < 30) return days + 'd ago';
  return Math.round(days / 30) + 'mo ago';
}

function healthColor(score) {
  if (score >= 70) return '';
  if (score >= 40) return 'warn';
  return 'err';
}

function healthLabel(score) {
  if (score >= 80) return 'Excellent';
  if (score >= 60) return 'Good';
  if (score >= 40) return 'Fair';
  return 'Needs attention';
}

function healthScoreColor(score) {
  if (score >= 70) return 'var(--ok)';
  if (score >= 40) return 'var(--warn)';
  return 'var(--err)';
}

function formatExpiry(str) {
  if (!str) return '';
  // card expiry MM/YY
  if (/^\d{2}\/\d{2}$/.test(str)) return str;
  // ISO date
  try {
    const d = new Date(str);
    return d.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'2-digit'});
  } catch(e) { return str; }
}

function render() {
  const el = document.getElementById('wrap');
  let snap;
  try { snap = JSON.parse(localStorage.getItem('VaultCap_widget')); } catch(e) {}

  if (!snap) {
    el.innerHTML = `
      <div class="hdr">
        <div class="hdr-brand">
          <div class="hdr-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </div>
          <div class="hdr-title">VaultCap</div>
        </div>
      </div>
      <div class="empty">
        <div class="empty-ic">🔒</div>
        <div class="empty-title">No data yet</div>
        <div class="empty-sub">Open VaultCap and unlock your vault to populate this widget with your financial snapshot.</div>
        <a class="open-btn" href="index.html" style="display:inline-flex;text-decoration:none">Open VaultCap →</a>
      </div>
      <div class="install-tip">💡 Add to Home Screen for quick access — Safari → Share → Add to Home Screen</div>`;
    return;
  }

  const staleMs = Date.now() - new Date(snap.updatedAt || snap.updated || 0).getTime();
  const isStale = staleMs > 24 * 60 * 60 * 1000;
  const staleHours = Math.round(staleMs / 3600000);

  const health = snap.vaultHealth ?? null;
  const expiringCount = snap.expiringCount ?? (snap.expiringItems || []).length;
  const backupDays = snap.lastBackup
    ? Math.floor((Date.now() - new Date(snap.lastBackup).getTime()) / 86400000)
    : null;
  const backupDotClass = backupDays === null ? 'dot-err'
    : backupDays <= 7 ? 'dot-ok'
    : backupDays <= 30 ? 'dot-warn'
    : 'dot-err';

  el.innerHTML = `
    <div class="hdr">
      <div class="hdr-brand">
        <div class="hdr-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <div class="hdr-title">VaultCap</div>
      </div>
      <button class="refresh-btn" onclick="render()" title="Refresh">↻</button>
    </div>

    <div class="hero">
      <div class="hero-label">Vault Status</div>
      <div class="hero-nw" style="font-size:22px;-webkit-text-fill-color:var(--text)">🔒 Locked</div>
      <div class="hero-name">Open VaultCap to view net worth</div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-n">${snap.bankCount ?? snap.banks ?? 0}</div>
        <div class="stat-l">Banks</div>
      </div>
      <div class="stat">
        <div class="stat-n">${snap.cardCount ?? snap.cards ?? 0}</div>
        <div class="stat-l">Cards</div>
      </div>
      <div class="stat">
        <div class="stat-n">${snap.documentCount ?? 0}</div>
        <div class="stat-l">Docs</div>
      </div>
    </div>

    ${health !== null ? `
    <div class="health">
      <div class="health-hdr">
        <div class="health-label">Vault Health</div>
        <div class="health-score" style="color:${healthScoreColor(health)}">${health}/100 · ${healthLabel(health)}</div>
      </div>
      <div class="health-bar-bg">
        <div class="health-bar-fill ${healthColor(health)}" style="width:${health}%"></div>
      </div>
    </div>` : ''}

    ${expiringCount > 0 ? `
    <div class="expiring">
      <div class="expiring-hdr">⚠ ${expiringCount} item${expiringCount === 1 ? '' : 's'} expiring soon</div>
      <div class="exp-item"><div class="exp-name">Open vault for details</div></div>
    </div>` : ''}

    <div class="footer-row">
      <a class="open-btn" href="index.html">Open VaultCap →</a>
    </div>

    <div class="updated-row">
      <div style="display:flex;align-items:center;gap:6px">
        <div class="dot ${backupDotClass}"></div>
        <span>Backup: ${backupDays === null ? 'never' : backupDays === 0 ? 'today' : backupDays + 'd ago'}</span>
      </div>
      ${isStale
        ? `<div class="stale-badge">⏸ Offline · ${staleHours}h old</div>`
        : `<span>Updated ${timeAgo(snap.updatedAt || snap.updated)}</span>`}
    </div>

    <div class="install-tip">💡 Add to Home Screen — Safari → Share → Add to Home Screen</div>`;
}

render();
setInterval(render, 30000);
</script>
</body>
</html>
